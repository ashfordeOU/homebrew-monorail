name: Sign every commit (one-off)

# Re-signs every commit on main with the same SSH key as the daily update, as ashfordeOU, keeping
# each commit's date, then removes this workflow in a signed commit. Run once by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sign every commit
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "::error::COMMIT_SIGNING_KEY is missing"; exit 1; }
          key="$RUNNER_TEMP/signing_key"; printf '%s\n' "$SIGNING_KEY" > "$key"; chmod 600 "$key"
          git config user.name ashfordeOU
          git config user.email 236818772+ashfordeOU@users.noreply.github.com
          git config gpg.format ssh
          git config user.signingkey "$key"
          git config commit.gpgsign true
          # Remove this workflow first, so the last signed commit leaves the tap as it was.
          git rm -q .github/workflows/resign.yml
          git commit -q -S -m "Remove the one-off signing workflow"
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git rebase --root --committer-date-is-author-date \
            --exec 'git commit --amend --no-edit --allow-empty -S --author="ashfordeOU <236818772+ashfordeOU@users.noreply.github.com>" --date="$(git log -1 --format=%aI)"'
          git log --format='%h %G? %an %ae %s' | head -20
          rm -f "$key"
          git push --force-with-lease origin HEAD:main
